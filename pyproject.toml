[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversaryflow"
version = "0.1.0"
description = "Safety-first AI-assisted purple-team campaign planning"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
adversaryflow = "adversaryflow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "bandit>=1.7", "pip-audit>=2.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
