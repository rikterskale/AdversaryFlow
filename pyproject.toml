[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversaryflow"
version = "0.2.3"
description = "Safety-first AI-assisted purple-team campaign planning"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
adversaryflow = "adversaryflow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "bandit>=1.7", "pip-audit>=2.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
adversaryflow = ["resources/*.yaml", "resources/*.json", "resources/*.html", "resources/*.css", "resources/*.js"]
