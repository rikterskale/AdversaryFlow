[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "adversaryflow"
dynamic = ["version"]
description = "Development-lab MITRE ATT&CK adversary-emulation workflow planner"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AdversaryFlow contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mitre-attack", "purple-team", "detection-engineering", "adversary-emulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  "blinker==1.9.0",
  "click==8.5.0",
  "Flask==3.1.3",
  "itsdangerous==2.2.0",
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.3",
  "waitress==3.0.2",
  "Werkzeug==3.1.8",
]

[project.urls]
Homepage = "https://github.com/rikterskale/AdversaryFlow"
Issues = "https://github.com/rikterskale/AdversaryFlow/issues"
Documentation = "https://github.com/rikterskale/AdversaryFlow/tree/main/docs"
Changelog = "https://github.com/rikterskale/AdversaryFlow/blob/main/CHANGELOG.md"

[project.scripts]
adversaryflow = "backend.app:main"
adversaryflow-telemetry = "backend.telemetry:main"

[tool.setuptools]
packages = ["backend"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }

[tool.setuptools.data-files]
"share/adversaryflow/frontend" = [
  "frontend/index.html",
  "frontend/styles.css",
  "frontend/app.js",
]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv", "dist", "build", "data", "node_modules"]

[tool.ruff.lint]
# Correctness and quality rules. Stylistic modernization (pyupgrade "UP") is
# deliberately excluded: the codebase targets 3.10+ but keeps explicit typing
# imports, and rewriting them is churn rather than a defect class.
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF", "ARG", "PIE", "RET", "TID"]
ignore = [
  # The catalog part files are reviewed as data tables; one entry per line keeps
  # each ATT&CK technique diffable even when the line runs long.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Catalog part files are pure data; the merge in command_catalog_extended.py is
# an intentional import-time side effect.
"backend/ext_part*.py" = ["E501"]
# Fakes and mock side_effects must mirror the signature they stand in for, so
# an unused parameter there is required rather than dead.
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.10"
files = ["backend", "scripts", "tests"]
exclude = "(^|/)(\\.venv|build|dist|node_modules)/"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# waitress ships no type information; the server import is a thin boundary.
module = ["waitress", "waitress.*"]
ignore_missing_imports = true
follow_untyped_imports = true
