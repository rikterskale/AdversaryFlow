[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "adversaryflow"
dynamic = ["version"]
description = "Development-lab MITRE ATT&CK adversary-emulation workflow planner"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AdversaryFlow contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mitre-attack", "purple-team", "detection-engineering", "adversary-emulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = [
  "blinker==1.9.0",
  "click==8.5.0",
  "Flask==3.1.3",
  "itsdangerous==2.2.0",
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.3",
  "waitress==3.0.2",
  "Werkzeug==3.1.8",
]

[project.urls]
Homepage = "https://github.com/rikterskale/AdversaryFlow"
Issues = "https://github.com/rikterskale/AdversaryFlow/issues"
Documentation = "https://github.com/rikterskale/AdversaryFlow/tree/main/docs"
Changelog = "https://github.com/rikterskale/AdversaryFlow/blob/main/CHANGELOG.md"

[project.scripts]
adversaryflow = "backend.app:main"

[tool.setuptools]
packages = ["backend"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "backend.__version__" }

[tool.setuptools.data-files]
"share/adversaryflow/frontend" = [
  "frontend/index.html",
  "frontend/styles.css",
  "frontend/app.js",
]
