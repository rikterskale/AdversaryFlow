openapi: 3.1.0
info:
  title: AdversaryFlow API
  version: 0.5.3
  description: Local API for ATT&CK actors and guided emulation plans. When the service is bound beyond loopback, every API operation requires BearerToken authentication.
servers:
  - url: http://127.0.0.1:5000
security:
  - {}
  - BearerToken: []
paths:
  /api/session:
    get:
      summary: Issue a same-origin token for mutating local operations
      responses:
        "200":
          description: Browser session token
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token, version]
                properties:
                  csrf_token: { type: string }
                  version: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/bootstrap:
    get:
      summary: Report background ATT&CK bootstrap progress
      responses:
        "200": { description: Data is ready }
        "202": { description: Bootstrap is running }
        "401": { $ref: "#/components/responses/Error" }
        "503": { description: Bootstrap has not started or failed }
    post:
      summary: Start or retry background ATT&CK bootstrap
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200": { description: Data is ready }
        "202": { description: Bootstrap started or is already running }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/live:
    get:
      summary: Report process liveness
      description: Returns HTTP 200 whenever the process can answer. ATT&CK readiness is /api/health.
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { const: live }
                  version: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/health:
    get:
      summary: Report ATT&CK readiness
      responses:
        "200":
          description: ATT&CK data is ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Process is live but ATT&CK data is not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Error" }
  /api/doctor:
    get:
      summary: Run the host diagnostics self-test
      description: Returns the same structured PASS/FAIL report as the adversaryflow doctor command. Docker and live-feed reachability are advisory so native and offline installations remain supported.
      responses:
        "200":
          description: Completed diagnostics report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diagnostics" }
        "401": { $ref: "#/components/responses/Error" }
  /api/actors:
    get:
      summary: List groups and campaigns with mapped techniques
      parameters:
        - $ref: "#/components/parameters/Domains"
      responses:
        "200":
          description: Actor collection and data version
          content:
            application/json:
              schema:
                type: object
                required: [actors, domains, data_version, version]
                properties:
                  actors: { type: array, items: { $ref: "#/components/schemas/Actor" } }
                  domains: { type: array, items: { type: string } }
                  data_version: { type: string }
                  version: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/workflow/{stix_id}:
    get:
      summary: Build a versioned workflow for one actor
      parameters:
        - name: stix_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Domains"
      responses:
        "200":
          description: Ordered workflow with commands and metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workflow" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/intelligence/import:
    post:
      summary: Preview structured ATT&CK mappings against an actor
      description: Accepts a bounded raw CSV, ATT&CK Navigator layer JSON, or STIX 2.1 bundle. Returns provenance-hashed review candidates and report-only/ATT&CK-only/shared technique sets. No candidate is accepted, persisted, or executed.
      parameters:
        - name: domains
          in: query
          required: true
          schema: { type: string, example: enterprise }
        - name: actor_stix_id
          in: query
          required: true
          schema: { type: string }
        - name: source_kind
          in: query
          required: true
          schema: { enum: [csv, json] }
        - name: source_name
          in: query
          required: true
          schema: { type: string, maxLength: 300 }
        - name: source_url
          in: query
          required: false
          schema: { type: string, format: uri }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, x-maxBytes: 16777216 }
          application/json:
            schema: { type: object, x-maxBytes: 16777216 }
      responses:
        "200":
          description: Provenance-preserving review candidates and technique-set comparison
          content:
            application/json:
              schema: { $ref: "../schemas/adversaryflow-intelligence.schema.json" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/execution-kit:
    post:
      summary: Generate an offline CSV and PowerShell/Bash operator handoff
      description: Rebinds every technique to the live catalog, then serializes a ZIP. Client-supplied command text is discarded. Bounded synthetic steps include AdversaryFlow-exercises.py. The service does not execute commands.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema_version, tool, actor, scope, execution_context, stages]
              properties:
                schema_version: { enum: ["2.0", "3.0"] }
                tool: { const: AdversaryFlow }
                actor: { type: object }
                scope: { type: object }
                execution_context: { type: object }
                stages: { type: array, minItems: 1, maxItems: 32 }
      responses:
        "200":
          description: ZIP containing the operator CSV and matching standalone runner
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/playbook/atomic:
    post:
      summary: Generate an Atomic Red Team draft pack and ability backlog
      description: Rebinds plan techniques to the local catalog, exports only abilities marked reviewed as Atomic YAML, and places missing, wrong-shape, out-of-scope, and unaccepted items in an open-gap manifest. This route serializes files only and never invokes an Atomic executor.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "../schemas/adversaryflow-plan.schema.json" }
                - { $ref: "../schemas/adversaryflow-plan-v3.schema.json" }
      responses:
        "200":
          description: ZIP containing reviewed Atomic YAML files when available and an AdversaryFlow manifest
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/ability-backlog:
    get:
      summary: List persisted ability gap backlog items
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: status
          in: query
          required: false
          schema: { enum: [open, in_progress, accepted, closed] }
      responses:
        "200":
          description: Backlog items with owners and workflow status
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/ability-backlog/{item_id}:
    patch:
      summary: Assign an owner and update backlog status
      parameters:
        - { name: item_id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, status]
              properties:
                owner: { type: [string, "null"], maxLength: 120 }
                status: { enum: [open, in_progress, accepted, closed] }
      responses:
        "200": { description: Updated backlog item, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/engagements:
    get:
      summary: List saved engagement records
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Latest revision metadata for each saved engagement
          content:
            application/json:
              schema:
                type: object
                required: [engagements]
                properties:
                  engagements: { type: array, items: { $ref: "#/components/schemas/EngagementSummary" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Create or append an immutable engagement plan revision
      description: Validates an AdversaryFlow schema 2.0 or 3.0 plan and stores its pinned ATT&CK data version, revision, and canonical SHA-256 digest in the local SQLite engagement store. Omit engagement_id to create a new engagement.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                engagement_id: { type: string, format: uuid }
                plan:
                  oneOf:
                    - { $ref: "../schemas/adversaryflow-plan.schema.json" }
                    - { $ref: "../schemas/adversaryflow-plan-v3.schema.json" }
      responses:
        "201":
          description: Stored immutable plan revision
          content:
            application/json:
              schema:
                type: object
                required: [engagement_id, revision, plan_sha256, created_at]
                properties:
                  engagement_id: { type: string, format: uuid }
                  revision: { type: integer, minimum: 1 }
                  plan_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
                  created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/engagements/{engagement_id}:
    get:
      summary: Retrieve an engagement and its revision history
      parameters:
        - { name: engagement_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Engagement metadata, revision digests, and the latest plan
          content:
            application/json:
              schema: { $ref: "../schemas/adversaryflow-engagement.schema.json" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/engagements/{engagement_id}/revisions/{revision}:
    get:
      summary: Retrieve a specific immutable plan revision
      parameters:
        - { name: engagement_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: The plan, schema version, creation time, and canonical digest
          content:
            application/json:
              schema: { type: object, required: [engagement_id, revision, schema_version, plan_sha256, created_at, plan] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/report/{report_format}:
    post:
      summary: Generate a purple-team engagement report artifact
      description: Rebinds techniques to the live bounded catalog, then renders expected telemetry, ATT&CK detection guidance, catalog-provided Sigma references, recorded outcomes, and coverage gaps. HTML and PDF are command-free and PDF is rendered from the same self-contained HTML. JSON returns the submitted schema-versioned plan unchanged as the canonical machine-readable record. Report generation never executes commands.
      parameters:
        - name: report_format
          in: path
          required: true
          schema: { enum: [html, pdf, json] }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema_version, tool, actor, scope, execution_context, stages]
              properties:
                schema_version: { enum: ["2.0", "3.0"] }
                tool: { const: AdversaryFlow }
                actor: { type: object }
                scope: { type: object }
                execution_context: { type: object }
                stages: { type: array, minItems: 1, maxItems: 32 }
      responses:
        "200":
          description: Downloadable HTML or PDF engagement report, or canonical plan JSON
          content:
            text/html:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
            application/json:
              schema:
                type: object
                required: [schema_version, tool, actor, scope, execution_context, stages]
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/refresh:
    post:
      summary: Refresh selected ATT&CK domains and rebuild their index
      description: Failed upstream updates return 503 with error refresh_failed. Valid cached plans remain available; clients must preserve their current evidence on failure.
      parameters:
        - $ref: "#/components/parameters/Domains"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Refreshed data version
          content:
            application/json:
              schema:
                type: object
                required: [status, domains, data_version]
                properties:
                  status: { const: refreshed }
                  domains: { type: array, items: { type: string } }
                  data_version: { type: string }
                  cache: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      description: Required on every API route only when non-loopback remote mode is enabled.
  parameters:
    CsrfToken:
      name: X-AdversaryFlow-CSRF
      in: header
      required: true
      description: Same-origin token returned by GET /api/session. A rejected expired token returns 403 with error csrf_expired; obtain a new session token and retry once. Other 403 responses must not be retried automatically.
      schema: { type: string }
    Domains:
      name: domains
      in: query
      description: Comma-separated ATT&CK domains.
      schema:
        type: string
        default: enterprise
        examples: [enterprise, "enterprise,ics,mobile"]
  schemas:
    EngagementSummary:
      type: object
      required: [id, actor_id, actor_name, data_version, created_at, updated_at, revision, schema_version, plan_sha256]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string }
        actor_name: { type: string }
        data_version: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        revision: { type: integer }
        schema_version: { type: string }
        plan_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    Actor:
      type: object
      required: [stix_id, attack_id, name, type, aliases, description, technique_count]
      properties:
        stix_id: { type: string }
        attack_id: { type: string }
        name: { type: string }
        type: { enum: [group, campaign] }
        aliases: { type: array, items: { type: string } }
        description: { type: string }
        technique_count: { type: integer, minimum: 0 }
      additionalProperties: false
    Workflow:
      type: object
      required: [actor, summary, kill_chain, stages, metadata]
      properties:
        actor: { type: object }
        summary:
          type: object
          required: [total_techniques, unique_stages, curated_commands, fallback_commands]
        kill_chain:
          type: array
          items:
            type: object
            required: [tactic, title]
            properties:
              tactic: { type: string }
              title: { type: string }
        stages:
          type: array
          items: { $ref: "#/components/schemas/Stage" }
        metadata:
          type: object
          required: [domains, data_version, version]
          properties:
            domains: { type: array, items: { type: string } }
            data_version: { type: string }
            version: { type: string }
    Stage:
      type: object
      required: [tactic, title, techniques]
      properties:
        tactic: { type: string }
        title: { type: string }
        techniques:
          type: array
          items: { $ref: "#/components/schemas/Technique" }
    Technique:
      type: object
      required: [attack_id, name, commands, command_source]
      properties:
        attack_id: { type: string }
        name: { type: string }
        stix_id: { type: string }
        description: { type: string }
        tactics: { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string } }
        is_subtechnique: { type: boolean }
        data_sources: { type: array, items: { type: string } }
        detection: { type: string }
        url: { type: [string, "null"], format: uri }
        commands:
          type: array
          items: { $ref: "#/components/schemas/Command" }
        command_source: { enum: [curated, fallback] }
    Command:
      type: object
      required: [platform, command, note, cleanup, risk, side_effects, requires_admin, requires_network, network_targets, prerequisites, expected_telemetry, expected_output, timeout_seconds, rollback, cleanup_required, acknowledgment_required]
      properties:
        platform: { type: string }
        command: { type: string }
        note: { type: string }
        cleanup: { type: string }
        risk: { enum: [none, low, medium, high] }
        side_effects: { type: array, items: { type: string } }
        requires_admin: { type: boolean }
        requires_network: { type: boolean }
        network_targets: { type: array, items: { type: string } }
        prerequisites: { type: array, items: { type: string } }
        expected_telemetry: { type: string }
        expected_output: { type: string }
        timeout_seconds: { type: integer }
        rollback: { type: string }
        cleanup_required: { type: boolean }
        acknowledgment_required: { type: boolean }
        interpreter: { enum: [cmd, powershell, bash] }
        exercise_kind: { enum: [technique_relevant_bounded] }
        fidelity: { enum: [direct, bounded_synthetic, lab_proxy] }
        evidence_source: { enum: [self_reported_receipt] }
        unsupported: { type: boolean }
        restricted: { type: boolean }
        telemetry_acceptance:
          type: object
          required: [technique_id, scenario, activity_event_types, minimum_activity_events, requirements, limitation]
          properties:
            technique_id: { type: string }
            scenario: { type: string }
            activity_event_types: { type: array, minItems: 1, items: { type: string } }
            minimum_activity_events: { type: integer, minimum: 1 }
            requirements: { type: array, minItems: 1, items: { type: string } }
            limitation: { type: string }
          additionalProperties: false
      additionalProperties: false
    Health:
      type: object
      required: [status, ready, loading, phase, version, error, attack_data, service]
      properties:
        status: { enum: [ready, degraded] }
        ready: { type: boolean }
        loading: { type: boolean }
        phase: { enum: [not_started, loading, refreshing, ready, failed] }
        version: { type: string }
        error: { type: [string, "null"] }
        attack_data: { type: object }
        service: { type: object }
    Diagnostics:
      type: object
      required: [version, generated_at, ok, summary, checks]
      properties:
        version: { type: string }
        generated_at: { type: string, format: date-time }
        ok: { type: boolean }
        summary:
          type: object
          required: [passed, failed, required_failed]
          properties:
            passed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            required_failed: { type: integer, minimum: 0 }
        checks:
          type: array
          items: { $ref: "#/components/schemas/DiagnosticCheck" }
    DiagnosticCheck:
      type: object
      required: [id, label, status, required, detail, fix]
      properties:
        id: { type: string }
        label: { type: string }
        status: { enum: [PASS, FAIL] }
        required: { type: boolean }
        detail: { type: string }
        fix: { type: string }
      additionalProperties: false
    Error:
      type: object
      required: [error, message, version]
      properties:
        error: { type: string }
        message: { type: string }
        request_id: { type: string }
        version: { type: string }
  responses:
    Error:
      description: Structured application error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
