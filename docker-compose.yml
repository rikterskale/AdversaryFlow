name: adversaryflow

services:
  adversaryflow:
    image: adversaryflow:0.5.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ADVERSARYFLOW_API_TOKEN: "${ADVERSARYFLOW_API_TOKEN:-}"
      # This is the host-side publish address, not the app's container bind.
      ADVERSARYFLOW_BIND_ADDRESS: "${ADVERSARYFLOW_BIND_ADDRESS:-127.0.0.1}"
      ADVERSARYFLOW_CACHE_DIR: "${ADVERSARYFLOW_CACHE_DIR:-/var/lib/adversaryflow/cache}"
      # Bridge networking requires the service to listen on the container
      # interface. The host publication below remains loopback-only by default.
      ADVERSARYFLOW_HOST: "${ADVERSARYFLOW_HOST:-0.0.0.0}"
      ADVERSARYFLOW_LOG_LEVEL: "${ADVERSARYFLOW_LOG_LEVEL:-info}"
      ADVERSARYFLOW_OFFLINE: "${ADVERSARYFLOW_OFFLINE:-false}"
      ADVERSARYFLOW_PORT: "${ADVERSARYFLOW_PORT:-5000}"
      ADVERSARYFLOW_PUBLIC_URL: "${ADVERSARYFLOW_PUBLIC_URL:-}"
    ports:
      # REMOTE OPT-IN (off by default): set ADVERSARYFLOW_BIND_ADDRESS=0.0.0.0,
      # ADVERSARYFLOW_API_TOKEN to a long random value, and PUBLIC_URL to the
      # TLS-protected URL. The entrypoint refuses remote publication without
      # that explicit token.
      - "${ADVERSARYFLOW_BIND_ADDRESS:-127.0.0.1}:${ADVERSARYFLOW_PORT:-5000}:${ADVERSARYFLOW_PORT:-5000}"
    volumes:
      - "adversaryflow-stix-cache:${ADVERSARYFLOW_CACHE_DIR:-/var/lib/adversaryflow/cache}"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/adversaryflow:rw,noexec,nosuid,size=64k,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  adversaryflow-stix-cache:
    name: adversaryflow-stix-cache
