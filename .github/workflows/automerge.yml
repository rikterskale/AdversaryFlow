name: Auto-merge

# Turns on auto-merge for the maintainer's own pull requests so they land only
# after every required check passes. Admin enforcement is off on main, so this
# is a guardrail rather than a gate: it makes the verified path the effortless
# one without removing the ability to override by hand.
#
# This workflow deliberately does not delete merged branches, and a job that
# tries will not work. GitHub does not start a workflow run from an event
# generated with GITHUB_TOKEN, so the merge queued here produces neither a
# "closed" pull-request run nor a push run on main - a cleanup job triggered by
# "closed" never fires. The repository's delete_branch_on_merge setting also
# left these branches in place. Remove one with:
#
#     git push origin --delete <branch>
#
# The same rule means merge commits created this way carry no check run of
# their own. Verification still happens, on the pull request: required checks
# run there, and strict mode forces the branch up to date first, so a rebase
# merge lands the exact tree that passed.
#
# pull_request_target always runs the workflow from the base branch, so changes
# here only take effect once merged to main.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    # Only the maintainer's own pull requests. Without this gate an outside
    # contributor's branch would be queued to merge itself.
    if: github.event.pull_request.user.login == 'rikterskale'
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs with write permissions against the base repo,
      # so this job deliberately checks out nothing and only calls the API.
      # --rebase because main requires linear history.
      - run: gh pr merge --auto --rebase "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
