name: Auto-merge

# Use only the trusted base workflow: never check out PR code with this token.
# Explicitly wait for CI and CodeQL even when branch protection is unavailable.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    name: Merge after CI and CodeQL
    if: github.event.pull_request.user.login == 'rikterskale' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          def gh_json(*args):
              return json.loads(subprocess.check_output(["gh", *args], text=True))

          def wait_and_merge(repo, pr_url, head, attempts=40):
              for attempt in range(attempts):
                  pr = gh_json("pr", "view", pr_url, "--json", "state,isDraft,headRefOid,baseRefName")
                  if (pr["state"] != "OPEN" or pr["isDraft"] or pr["headRefOid"] != head
                          or pr["baseRefName"] != "main"):
                      print("PR closed, drafted, or updated; leaving it unmerged.")
                      return
                  ready = True
                  for workflow in ("ci.yml", "codeql.yml"):
                      runs = gh_json("api", f"repos/{repo}/actions/workflows/{workflow}/runs"
                                     f"?event=pull_request&head_sha={head}&per_page=1")["workflow_runs"]
                      if not runs or runs[0]["status"] != "completed":
                          ready = False
                      elif runs[0]["conclusion"] != "success":
                          raise SystemExit(f"{workflow} did not succeed; refusing to merge.")
                  if ready:
                      base = gh_json("api", f"repos/{repo}/commits/main")["sha"]
                      comparison = gh_json("api", f"repos/{repo}/compare/{base}...{head}")
                      if comparison["merge_base_commit"]["sha"] != base:
                          raise SystemExit("Update the PR from its base and rerun checks before merging.")
                      subprocess.run(["gh", "pr", "merge", "--rebase", "--match-head-commit", head,
                                      pr_url], check=True)
                      return
                  if attempt + 1 < attempts:
                      time.sleep(30)
              raise SystemExit("Timed out waiting for CI and CodeQL; leaving the PR unmerged.")

          if __name__ == "__main__":
              wait_and_merge(os.environ["REPO"], os.environ["PR_URL"], os.environ["PR_HEAD"])
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
