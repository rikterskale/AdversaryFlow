name: AdversaryFlow Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish GitHub release
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check --upgrade pip build
      - name: Build release
        run: python scripts/release.py artifacts/release
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --title "AdversaryFlow $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
