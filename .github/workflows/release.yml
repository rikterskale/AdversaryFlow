name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify immutable release identity
        run: |
          git cat-file -t "$GITHUB_REF_NAME" | grep -qx tag
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME"
      - run: python -m pip install --require-hashes --requirement requirements.lock
      - run: python -m pip install --require-hashes --requirement requirements-build.lock
      - run: python -m pip install --no-build-isolation --no-deps --editable .
      - run: python -m unittest discover --verbose
      - run: node --check frontend/app.js
      - run: bash -n install.sh run.sh
      - run: python -m build --no-isolation
      - run: python scripts/build_sbom.py
      - name: Generate checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Attest Python distributions
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
      - name: Stage Python distributions
        if: vars.PUBLISH_PYPI == 'true'
        run: mkdir publish && cp dist/*.whl dist/*.tar.gz publish/
      - name: Publish to PyPI with trusted publishing
        if: vars.PUBLISH_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish/
