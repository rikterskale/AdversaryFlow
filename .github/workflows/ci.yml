name: AdversaryFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --cov=adversaryflow --cov-branch --cov-report=term-missing --cov-fail-under=50
      - run: python -m adversaryflow doctor --json
      - run: python -m adversaryflow demo

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
      - uses: github/dependency-review-action@v4
        if: github.event_name == 'pull_request'
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install bandit pip-audit
      - run: bandit -r src -q
      - run: pip-audit

  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check .github"
      - uses: zizmorcore/zizmor-action@v0.2.0
        with:
          persona: pedantic

  sbom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build cyclonedx-bom
      - run: python scripts/release.py artifacts/release
      - run: python -c "import json; d=json.load(open('artifacts/release/sbom.cdx.json')); assert d['bomFormat']=='CycloneDX'"

  artifact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python scripts/release.py artifacts/release
      - run: python -c "from scripts.release import verify_release; assert verify_release('artifacts/release')"
      - run: python -m pip install artifacts/release/*.whl
      - run: adversaryflow doctor --json
      - run: adversaryflow demo
      - run: python -m pip install artifacts/release/*.tar.gz

  first-user-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python scripts/release.py artifacts/release
      - run: python scripts/artifact_journey.py artifacts/release

  distro-matrix:
    strategy:
      matrix:
        include:
          - name: debian
            image: debian:12
          - name: ubuntu
            image: ubuntu:24.04
          - name: kali
            image: kalilinux/kali-rolling
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3 python3-venv python3-pip
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install --break-system-packages -e '.[dev]'
      - run: .venv/bin/python -m adversaryflow doctor --json
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m adversaryflow demo
