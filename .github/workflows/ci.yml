name: AdversaryFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --cov=adversaryflow --cov-branch --cov-report=term-missing --cov-fail-under=50
      - run: python -m adversaryflow doctor --json
      - run: python -m adversaryflow demo

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        if: github.event_name == 'pull_request'
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m venv .venv-security
      - run: .venv-security/bin/python -m pip install --upgrade pip
      - run: .venv-security/bin/python -m pip install bandit pip-audit '.[dev]'
      - run: .venv-security/bin/bandit -r src -q
      - run: .venv-security/bin/pip-audit

  workflow-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install zizmor
      - run: zizmor .github/workflows/ci.yml

  sbom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build cyclonedx-bom
      - run: python scripts/release.py artifacts/release
      - run: python -c "import json; d=json.load(open('artifacts/release/sbom.cdx.json')); assert d['bomFormat']=='CycloneDX'"

  artifact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python scripts/release.py artifacts/release
      - run: python -c "from scripts.release import verify_release; assert verify_release('artifacts/release')"
      - run: python -m pip install artifacts/release/*.whl
      - run: adversaryflow doctor --json
      - run: adversaryflow demo
      - run: python -m pip install artifacts/release/*.tar.gz

  first-user-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python scripts/release.py artifacts/release
      - run: python scripts/artifact_journey.py artifacts/release

  windows-first-user-journey:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python scripts/release.py artifacts/release
      - run: python scripts/artifact_journey.py artifacts/release

  distro-matrix:
    strategy:
      matrix:
        include:
          - name: debian
            image: debian:12
          - name: ubuntu
            image: ubuntu:24.04
          - name: kali
            image: kalilinux/kali-rolling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          -w /workspace
          "${{ matrix.image }}"
          bash -lc "apt-get update && apt-get install -y python3 python3-venv python3-pip && python3 -m venv .venv && .venv/bin/python -m pip install --break-system-packages -e '.[dev]' && .venv/bin/python -m adversaryflow doctor --json && .venv/bin/python -m pytest -q && .venv/bin/python -m adversaryflow demo"
